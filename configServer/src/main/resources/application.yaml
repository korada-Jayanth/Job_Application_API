spring:
  application:
    name: configServer
  cloud:
    config:
      server:
        git:
          uri: "https://github.com/korada-Jayanth/application-config/"

server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true


